<style>
:root{--bg:#f3f0e9;--surf:#fff;--ink:#1a1a1e;--mut:#6a6a72;--line:#d8d3c8;--acc:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--surf:#1a1a1e;--ink:#ece9e1;--mut:#9a9aa3;--line:#2d2d33;--acc:#e8574d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--surf:#1a1a1e;--ink:#ece9e1;--mut:#9a9aa3;--line:#2d2d33;--acc:#e8574d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:880px;margin:0 auto;padding:24px 16px 48px}h1{margin:0 0 4px;font-size:clamp(24px,5vw,34px);letter-spacing:-.02em}p{margin:0 0 20px;color:var(--mut)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.c{display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px}
.c img{width:100%;aspect-ratio:2/3;object-fit:cover;object-position:top;border-radius:6px;background:#888;margin-bottom:6px}.c b{font-size:14px}.c span{font-size:12px;color:var(--mut)}
.ch{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.k{display:flex;flex-direction:column;justify-content:center;min-height:46px;color:inherit;text-decoration:none;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600}
.k span{font-size:11px;font-weight:400;color:var(--mut)}.k.x{font-weight:400;color:var(--mut)}.k:hover{border-color:var(--acc)}
.bk{display:inline-block;margin-bottom:14px;color:var(--mut);text-decoration:none;font-size:14px}
